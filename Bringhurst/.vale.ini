StylesPath = styles
MinAlertLevel = suggestion

[formats]
tex = md

[*.tex]
BasedOnStyles = Bringhurst, BringhurstTeX
BlockIgnores = (?s)\$\$.*?\$\$, \
               (?s)\\\[.*?\\\], \
               (?s)\\begin\{(equation|align|gather|multline|flalign|eqnarray)\*?\}.*?\\end\{\1\*?\}, \
               (?s)\\begin\{(verbatim|lstlisting|minted|tikzpicture)\*?\}.*?\\end\{\1\*?\}
TokenIgnores = \$[^$\n]+\$, \
               \\\(.*?\\\), \
               \\verb\|[^|]+\|, \
               \\texttt\{[^}]*\}, \
               \\(cite|citep|citet|ref|eqref|pageref|label|url|href|includegraphics|usepackage|documentclass|input|include)\*?(\[[^\]]*\])?\{[^}]*\}, \
               (?m)(?:^|\s)%.*$

[*.{adoc,asciidoc}]
BasedOnStyles = Bringhurst, BringhurstAdoc
BlockIgnores = (?s)\[(stem|latexmath|asciimath)\]\s*\n----\n.*?\n----, \
               (?s)\+\+\+\+.*?\+\+\+\+
TokenIgnores = (stem|latexmath|asciimath):\[[^\]]*\], \
               ^:[a-zA-Z0-9_-]+:.*$, \
               <<[^>]+>>