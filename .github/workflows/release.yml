name: Release Vale Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Bringhurst.zip
        run: zip -r Bringhurst.zip Bringhurst

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Bringhurst.zip